AWSTemplateFormatVersion: "2010-09-09"
Description: DataForge360 - KMS Foundation Stack v3

Parameters:
  ProjectName:
    Type: String
    Default: DataForge360

  Environment:
    Type: String
    Default: Dev

  ResourcePrefix:
    Type: String
    Default: dataforge360-dev

  Owner:
    Type: String
    Default: Lalit

  CostCenter:
    Type: String
    Default: Learning

Resources:
  DataForgeKmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub "${ProjectName} ${Environment} encryption key for S3, RDS, Redshift, Glue, ECS, CloudTrail and CloudWatch Logs"
      EnableKeyRotation: true
      PendingWindowInDays: 30
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: EnableAccountRootPermissions
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"

          - Sid: AllowCloudTrailToEncryptLogs
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action:
              - kms:GenerateDataKey*
              - kms:DescribeKey
            Resource: "*"
            Condition:
              StringEquals:
                aws:SourceArn: !Sub "arn:aws:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/${ResourcePrefix}-trail"
              StringLike:
                kms:EncryptionContext:aws:cloudtrail:arn: !Sub "arn:aws:cloudtrail:*:${AWS::AccountId}:trail/*"

          - Sid: AllowCloudTrailBucketKeyValidation
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action:
              - kms:Decrypt
            Resource: "*"
            Condition:
              StringEquals:
                aws:SourceArn: !Sub "arn:aws:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/${ResourcePrefix}-trail"

          - Sid: AllowCloudWatchLogsToUseKey
            Effect: Allow
            Principal:
              Service: !Sub "logs.${AWS::Region}.amazonaws.com"
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:DescribeKey
            Resource: "*"
            Condition:
              ArnLike:
                kms:EncryptionContext:aws:logs:arn: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/ecs/${ResourcePrefix}/*"

      Tags:
        - Key: Name
          Value: !Sub "${ResourcePrefix}-kms-key"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref Owner
        - Key: CostCenter
          Value: !Ref CostCenter
        - Key: AutoDelete
          Value: "True"
        - Key: ManagedBy
          Value: CloudFormation

  DataForgeKmsAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/${ResourcePrefix}-key"
      TargetKeyId: !Ref DataForgeKmsKey

Outputs:
  KmsKeyId:
    Description: DataForge360 KMS Key ID
    Value: !Ref DataForgeKmsKey
    Export:
      Name: !Sub "${ResourcePrefix}-kms-key-id"

  KmsKeyArn:
    Description: DataForge360 KMS Key ARN
    Value: !GetAtt DataForgeKmsKey.Arn
    Export:
      Name: !Sub "${ResourcePrefix}-kms-key-arn"

  KmsAlias:
    Description: DataForge360 KMS Alias
    Value: !Sub "alias/${ResourcePrefix}-key"
    Export:
      Name: !Sub "${ResourcePrefix}-kms-alias"