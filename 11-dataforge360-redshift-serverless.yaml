AWSTemplateFormatVersion: "2010-09-09"
Description: DataForge360 - Redshift Serverless Warehouse

Parameters:
  ProjectName:
    Type: String
    Default: DataForge360

  Environment:
    Type: String
    Default: Dev

  ResourcePrefix:
    Type: String
    Default: dataforge360-dev

  Owner:
    Type: String
    Default: Lalit

  CostCenter:
    Type: String
    Default: Learning

  RedshiftDbName:
    Type: String
    Default: dev

  RedshiftAdminUsername:
    Type: String
    Default: dataforgeadmin

  RedshiftAdminPassword:
    Type: String
    NoEcho: true
    MinLength: 12
    Default: DataForge360Redshift@123

Resources:
  RedshiftServerlessSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Redshift Serverless workgroup
      VpcId:
        Fn::ImportValue:
          Fn::Sub: "${ResourcePrefix}-vpc-id"
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5439
          ToPort: 5439
          SourceSecurityGroupId:
            Fn::ImportValue:
              Fn::Sub: "${ResourcePrefix}-private-ec2-sg"
          Description: Allow Redshift access from private admin EC2
        - IpProtocol: tcp
          FromPort: 5439
          ToPort: 5439
          SourceSecurityGroupId:
            Fn::ImportValue:
              Fn::Sub: "${ResourcePrefix}-backend-task-sg"
          Description: Allow Redshift access from ECS backend tasks if needed later
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Allow outbound traffic
      Tags:
        - Key: Name
          Value: !Sub "${ResourcePrefix}-redshift-sg"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref Owner
        - Key: CostCenter
          Value: !Ref CostCenter
        - Key: AutoDelete
          Value: "True"
        - Key: ManagedBy
          Value: CloudFormation

  RedshiftSpectrumRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ResourcePrefix}-redshift-spectrum-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - redshift.amazonaws.com
                - redshift-serverless.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: !Sub "${ResourcePrefix}-redshift-spectrum-policy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadCuratedAndRawBuckets
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - Fn::Sub:
                      - "arn:aws:s3:::${CuratedBucketName}"
                      - CuratedBucketName:
                          Fn::ImportValue:
                            Fn::Sub: "${ResourcePrefix}-curated-bucket"
                  - Fn::Sub:
                      - "arn:aws:s3:::${CuratedBucketName}/*"
                      - CuratedBucketName:
                          Fn::ImportValue:
                            Fn::Sub: "${ResourcePrefix}-curated-bucket"
                  - Fn::Sub:
                      - "arn:aws:s3:::${RawBucketName}"
                      - RawBucketName:
                          Fn::ImportValue:
                            Fn::Sub: "${ResourcePrefix}-raw-bucket"
                  - Fn::Sub:
                      - "arn:aws:s3:::${RawBucketName}/*"
                      - RawBucketName:
                          Fn::ImportValue:
                            Fn::Sub: "${ResourcePrefix}-raw-bucket"

              - Sid: GlueCatalogReadAccess
                Effect: Allow
                Action:
                  - glue:GetDatabase
                  - glue:GetDatabases
                  - glue:GetTable
                  - glue:GetTables
                  - glue:GetPartition
                  - glue:GetPartitions
                  - glue:BatchGetPartition
                Resource: "*"

              - Sid: KmsDecryptForS3Data
                Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:DescribeKey
                Resource:
                  Fn::ImportValue:
                    Fn::Sub: "${ResourcePrefix}-kms-key-arn"
      Tags:
        - Key: Name
          Value: !Sub "${ResourcePrefix}-redshift-spectrum-role"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref Owner
        - Key: CostCenter
          Value: !Ref CostCenter
        - Key: AutoDelete
          Value: "True"
        - Key: ManagedBy
          Value: CloudFormation

  RedshiftNamespace:
    Type: AWS::RedshiftServerless::Namespace
    Properties:
      NamespaceName: !Sub "${ResourcePrefix}-rs-namespace"
      DbName: !Ref RedshiftDbName
      AdminUsername: !Ref RedshiftAdminUsername
      AdminUserPassword: !Ref RedshiftAdminPassword
      KmsKeyId:
        Fn::ImportValue:
          Fn::Sub: "${ResourcePrefix}-kms-key-arn"
      IamRoles:
        - !GetAtt RedshiftSpectrumRole.Arn
      DefaultIamRoleArn: !GetAtt RedshiftSpectrumRole.Arn
      LogExports:
        - userlog
        - connectionlog
        - useractivitylog
      Tags:
        - Key: Name
          Value: !Sub "${ResourcePrefix}-rs-namespace"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref Owner
        - Key: CostCenter
          Value: !Ref CostCenter
        - Key: AutoDelete
          Value: "True"
        - Key: ManagedBy
          Value: CloudFormation

  RedshiftWorkgroup:
    Type: AWS::RedshiftServerless::Workgroup
    Properties:
      WorkgroupName: !Sub "${ResourcePrefix}-rs-workgroup"
      NamespaceName: !Ref RedshiftNamespace
      BaseCapacity: 8
      EnhancedVpcRouting: false
      PubliclyAccessible: false
      Port: 5439
      SecurityGroupIds:
        - !Ref RedshiftServerlessSecurityGroup
      SubnetIds:
        - Fn::ImportValue:
            Fn::Sub: "${ResourcePrefix}-private-data-subnet-a"
        - Fn::ImportValue:
            Fn::Sub: "${ResourcePrefix}-private-data-subnet-b"
      ConfigParameters:
        - ParameterKey: enable_user_activity_logging
          ParameterValue: "true"
      Tags:
        - Key: Name
          Value: !Sub "${ResourcePrefix}-rs-workgroup"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref Owner
        - Key: CostCenter
          Value: !Ref CostCenter
        - Key: AutoDelete
          Value: "True"
        - Key: ManagedBy
          Value: CloudFormation

Outputs:
  RedshiftNamespaceName:
    Description: Redshift Serverless namespace
    Value: !Ref RedshiftNamespace
    Export:
      Name: !Sub "${ResourcePrefix}-redshift-namespace"

  RedshiftWorkgroupName:
    Description: Redshift Serverless workgroup
    Value: !Ref RedshiftWorkgroup
    Export:
      Name: !Sub "${ResourcePrefix}-redshift-workgroup"

  RedshiftSpectrumRoleArn:
    Description: IAM role ARN for Redshift Spectrum
    Value: !GetAtt RedshiftSpectrumRole.Arn
    Export:
      Name: !Sub "${ResourcePrefix}-redshift-spectrum-role-arn"

  RedshiftSecurityGroupId:
    Description: Redshift security group
    Value: !Ref RedshiftServerlessSecurityGroup
    Export:
      Name: !Sub "${ResourcePrefix}-redshift-sg"